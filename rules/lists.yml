# Lists — the named sets a rule condition can test with `list:<name>`.
#
# Loaded into the database at start and edited on the Rules page (Lists section). A list
# nobody edited takes this file's newer version at the next start; an edited one is left
# alone. `match: exact` compares the whole value, case-insensitively; `match: suffix` is
# for the TLD list — the value must end with an entry.
#
# These are the rules' own copies. config/threat_detection.yaml carries the detection
# pipeline's sets separately: that file decides what a finding is, this one decides what
# happens after.

