[project]
name = "logstotal"
version = "1.0.0"
description = "Self-hosted multi-engine detection reports for security logs"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "wagga40" }]
keywords = ["dfir", "sigma", "log-analysis", "threat-detection", "evtx", "self-hosted"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: System :: Logging",
]
dependencies = [
    "fastapi>=0.115.5",
    "uvicorn[standard]>=0.32.1",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.10",
    "fastapi-users[sqlalchemy]>=13.0.0",
    "huey[redis]>=2.5.2",
    "redis>=5.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.12",
    "pydantic-settings>=2.6.1",
    "pyyaml>=6.0.2",
    "docker>=7.1.0",
    "python-dotenv>=1.0",
    "alembic>=1.13",
    "py-tlsh>=4.12.1",
    "boto3>=1.35",
    "orjson>=3.11.8",
    "regex>=2026.6.28",
    "markdown-it-py>=4.2.0",
    # Outbound HTTP for live enrichment (app/intel/live_enrichment.py) and watch-rule
    # webhooks (app/intel/webhooks.py). Both import it lazily inside the request path,
    # so a missing httpx does not stop the app booting — it silently disables two
    # advertised features instead. Keep it a runtime dependency.
    "httpx>=0.27",
]


[project.urls]
Homepage = "https://github.com/wagga40/LogsTotal"
Documentation = "https://wagga40.github.io/LogsTotal/"
Issues = "https://github.com/wagga40/LogsTotal/issues"
Changelog = "https://github.com/wagga40/LogsTotal/blob/main/CHANGELOG.md"
[tool.pdm]
distribution = false

[tool.ruff]
target-version = "py311"
line-length = 180

[tool.ruff.lint]
select = ["F", "E", "W", "I", "B", "S", "C4", "C90", "SIM", "PERF", "PL", "RUF", "UP"]
ignore = [
    "E501",      # line length handled by formatter
    "PLR0911",   # too-many-return-statements: often clearer as-is
    "PLR0912",   # too-many-branches: worker/routing paths are legitimately branchy
    "PLR0913",   # too-many-arguments: FastAPI Depends() functions accept many args
    "PLR0915",   # too-many-statements: job orchestration flows are inherently long
    "PLR0917",   # too-many-positional-arguments: sibling of PLR0913 above — 26 of the 29
                 # hits are FastAPI route handlers whose Form()/Depends() params are
                 # positional by signature.
    "PLR2004",   # magic-value-comparison: http status codes, severity thresholds
    "PLC0415",   # import-outside-top-level: intentional for lazy/circular-avoidance
    "PLW0603",   # global-statement: intentional module singletons (redis, storage)
    "PLW2901",   # redefined-loop-name: sanitization/normalization pattern
    "S101",      # assert: pytest uses assert
    "S110",      # try-except-pass: used intentionally for best-effort cleanup
    "S112",      # try-except-continue: intentional per-iteration error isolation
    "S311",      # non-cryptographic-random: used only for jitter/backoff
    "S603",      # subprocess-without-shell-equals-true: we always pass arg lists
    "S607",      # start-process-with-partial-path: tool paths come from trusted workflow YAML
    "SIM102",    # collapsible-if: explicit branches often clearer
    "SIM105",    # suppressible-exception: contextlib.suppress isn't always clearer
    "SIM108",    # if-else-block-instead-of-ternary: readability sometimes wins
    "PERF401",   # manual-list-comprehension: readability sometimes wins
    "PERF203",   # try-except-in-loop: intentional per-iteration error isolation
    "B008",      # function-call-in-default-argument: FastAPI Depends() requires this
    "B027",      # empty-method-without-abstract-decorator: deliberate ABC hook
    "RUF012",    # mutable-class-default: pydantic/SQLAlchemy class attributes
    "UP042",     # replace-str-enum: str+Enum idiom used deliberately for JSON serialization
]


[tool.ruff.lint.mccabe]
# Well below the four functions that exceed it (53, 43, 40, 33 — each carrying an explicit
# noqa naming the debt), so new complexity is bounded without a flag-day rewrite of the
# job pipeline. Lower it as those come down.
max-complexity = 25

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR", "PLC", "PLW", "B017"]
"alembic/**" = ["S", "UP"]
"init_db.py" = ["S"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: marks tests that are slow (e.g., TLSH on large files)",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "watchdog>=6.0",
    "fakeredis>=2.21",
    "pytest-xdist>=3.8.0",
]
docs = [
    "zensical==0.0.65",
    "markdown-callouts==0.4.0",
]
