name: "Windows Event XML Analysis"
description: "Run Zircolite against a Windows event XML export (wevtutil qe /f:xml or Get-WinEvent ToXml)"
is_default: false
log_types:
  - xml_evtx

# Zircolite only. Hayabusa and Chainsaw both read EVTX binaries, not XML exports, so
# including them here would only produce two SKIPPED rows on every job.
#
# INPUT SHAPE (measured 2026-08-05 against wagga40/zircolite:latest, 4-event sample):
# Zircolite reads the two XML layouts with different, mutually exclusive flags —
#   rootless (repeated <Event>):  -x 1/4   --evtxtract-input 4/4
#   rooted   (<?xml?><Events>…):  -x 4/4   --evtxtract-input 0/4
# so the adapter sniffs the root element per file rather than committing to one flag.
# Do not pin either flag here via extra_args: that suppresses the sniffing (any explicit
# input-format flag wins) and silently under-parses every file of the other shape.
tasks:
  - tool: zircolite
    # Pinned by digest — see docs/runbooks/detection-tools.md#updating-rule-sets to move it.
    docker_image: wagga40/zircolite:4.0.0@sha256:552f1900fb5533a58fdad1ae61f46c09018271787d5d7a2d08cb318d3221461f
    rules_path: tools/zircolite/rules/rules_windows_merged.json
    timeout: 300
