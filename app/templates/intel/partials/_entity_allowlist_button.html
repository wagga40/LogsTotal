<button hx-post="/intel/entities/{{ entity.id }}/allowlist"
        hx-swap="outerHTML"
        class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg border text-xs transition
               {% if entity.allowlisted %}border-emerald-600/60 bg-emerald-900/30 text-emerald-300 hover:text-emerald-200{% else %}border-gray-700 bg-gray-800 text-gray-400 hover:text-emerald-300 hover:border-emerald-700/60{% endif %}"
        title="{% if entity.allowlisted %}Remove from allowlist (will reappear in IOC feed){% else %}Add to allowlist (suppress from IOC feed and threat context){% endif %}">
  {% if entity.allowlisted %}
    <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/></svg>
    Allowlisted
  {% else %}
    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
    Allowlist
  {% endif %}
</button>
