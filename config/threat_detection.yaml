  linux_download_exec:
    label: "Linux Download & Execute"
    description: "Download-to-shell pipelines, reverse-shell primitives and decode-and-run patterns on Linux command lines."
    default_severity: "critical"
    checks:
      - type: regex
        fields: [proctitle, cmd, CommandLine, a1, a2, a3]
        patterns:
          - name: download_pipe_shell
            pattern: '(?i)\b(curl|wget)\b[^|;&]{0,200}\|\s*(ba|z|da|a)?sh\b'
            severity: critical
          - name: dev_tcp_redirect
            pattern: '/dev/(tcp|udp)/'
            severity: critical
          - name: base64_decode_pipe
            pattern: '(?i)base64\s+(-d|--decode)[^|]{0,40}\|'
            severity: high
          - name: chmod_then_exec
            pattern: '(?i)chmod\s+(\+|u\+)x\b'
            severity: medium
          - name: python_inline_shell
            pattern: '(?i)python[23]?\s+-c\s+.{0,200}(socket|pty|subprocess)'
            severity: critical

  linux_persistence:
    label: "Linux Persistence"
    description: "Persistence via cron, systemd units, shell profiles, SSH keys, ld.so.preload and udev rules."
    default_severity: "high"
    checks:
      - type: regex
        fields: [proctitle, cmd, CommandLine, name, a1, a2, a3]
        patterns:
          - name: cron_modification
            pattern: '(?i)/etc/cron|/var/spool/cron|crontab\s+-'
            severity: high
          - name: systemd_unit
            pattern: '(?i)(/etc|/usr/lib)/systemd/system|systemctl\s+enable'
            severity: high
          - name: shell_profile
            pattern: '(?i)\.bashrc|\.bash_profile|\.zshrc|\.profile\b'
            severity: medium
          - name: authorized_keys
            pattern: '(?i)authorized_keys'
            severity: high
          - name: ld_preload
            pattern: '(?i)/etc/ld\.so\.preload|LD_PRELOAD='
            severity: high
          - name: rc_local
            pattern: '(?i)/etc/rc\.local'
            severity: medium
          - name: udev_rule
            pattern: '(?i)/etc/udev/rules\.d'
            severity: medium

  linux_priv_esc:
    label: "Linux Privilege Escalation"
    description: "SUID manipulation, sudoers edits, privileged group additions and root-shell shortcuts."
    default_severity: "high"
    checks:
      - type: regex
        fields: [proctitle, cmd, CommandLine, a1, a2, a3]
        patterns:
          - name: setuid_chmod
            pattern: '(?i)chmod\s+(u\+s|[24][0-7]{3})\b'
            severity: high
          - name: suid_search
            pattern: '(?i)find\s.{0,80}-perm\s+(-|/)?(4000|u\+s|u=s)'
            severity: high
          - name: sudoers_edit
            pattern: '(?i)/etc/sudoers|visudo'
            severity: high
          - name: admin_group_add
            pattern: '(?i)usermod\s+(-a\s+)?-G\s+(sudo|wheel|admin)|gpasswd\s+-a\s+\S+\s+(sudo|wheel)'
            severity: high
          - name: pkexec_invocation
            pattern: '(?i)\bpkexec\b'
            severity: medium
          - name: sudo_shell
            pattern: '(?i)sudo\s+(su\b|-i\b|bash\b|sh\b)'
            severity: medium
          - name: passwd_shadow_write
            pattern: '(?i)>>?\s*/etc/(passwd|shadow)'
            severity: critical
